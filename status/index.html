<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EOD TOC Status</title>
    <link rel="stylesheet" href="../style.css">
  </head>
  <body class="status-page">
    <main class="status-shell">
      <header class="status-header" aria-label="Status log">
        <div class="status-brand">
          <span class="status-word">STATUS</span>
          <span class="log-word">LOG</span>
        </div>
        <span class="status-state">INACTIVE</span>
      </header>

      <section class="status-list" aria-label="Status entries">
        <article class="status-entry">
          <h1>Hello World</h1>
          <p><em>In development. Coming soon.</em></p>
        </article>
      </section>
    </main>
  </body>
</html>
